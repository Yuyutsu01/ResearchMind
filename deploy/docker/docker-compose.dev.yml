services:
  backend:
    build: 
      context: ../../backend
      dockerfile: ../deploy/docker/backend/Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      # Mount the whole backend directory for hot-reloading
      - ../../backend:/app
    environment:
      - PYTHONUNBUFFERED=1
      - LLM_BASE_URL=http://host.docker.internal:11434/v1
      - LLM_API_KEY=ollama
      - LLM_MODEL=llama3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../deploy/docker/frontend/Dockerfile.dev
    ports:
      - "3000:5173" # Vite dev server default port is 5173, mapping it to 3000
    volumes:
      # Mount the whole frontend directory for HMR
      - ../../frontend:/app
      # Hide local node_modules so docker uses its own built version
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
