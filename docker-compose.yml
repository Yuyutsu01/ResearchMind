services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Mount the rag directory to persist any downloaded models or local FAISS index
      - ./backend/rag:/app/rag
      # Mount memory to persist task history
      - ./backend/agent_memory.json:/app/agent_memory.json
    environment:
      - PYTHONUNBUFFERED=1
      - LLM_BASE_URL=http://host.docker.internal:11434/v1
      - LLM_API_KEY=ollama
      - LLM_MODEL=llama3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
