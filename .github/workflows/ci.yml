name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Cache Pip Dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install flake8

    - name: Lint with flake8
      # E9, F63, F7, F82 check for syntax errors, compilation failures, and undefined variables.
      # This ensures we catch code-breaking bugs without blocking CI on PEP8 styling warnings.
      run: |
        flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run Agent Benchmark (Mock Mode)
      run: |
        python backend/benchmark.py --mock
